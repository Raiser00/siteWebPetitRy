backend:
  name: git-gateway
  branch: main 

media_folder: "assets/img" # Où seront stockées les photos uploadées
public_folder: "/assets/img"


collections:
  - name: "blog"
    label: "Actualités"
    folder: "actus" # Le dossier où sont tes fichiers .md d'actu
    media_folder: "assets/img"
    public_folder: "/assets/img"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image de couverture", name: "image", widget: "image", required: false }
      - { label: "Corps du texte", name: "body", widget: "markdown" }
  
  - name: "gazette"
    label: "La Gazette (PDF)"
    folder: "gazette" # Le dossier où seront stockés les PDF de la gazette
    media_folder: "assets/gazette"
    public_folder: "/assets/gazette"
    create: true
    slug: "gazette-{{year}}-{{month}}"
    extension: "md" # Le CMS crée un petit fichier texte pour chaque PDF
    format: "frontmatter"
    fields:
      - { label: "Tag", name: "tags", widget: "hidden", default: "gazette" }
      - { label: "Titre de l'édition", name: "title", widget: "string", placeholder: "Ex: Gazette n°34 - Avril 2024" }
      - { label: "Date de publication", name: "date", widget: "datetime" }
      - { label: "Le fichier PDF", name: "file", widget: "file", allow_multiple: false, choose_url: false }
      - { label: "Image de couverture", name: "thumbnail", widget: "image", required: false }

  - name: "VIP"
    label: "VIP du quartier"
    folder: "vip" # Le dossier où seront stockés les fichiers .md de VIP
    media_folder: "assets/vip"
    public_folder: "/assets/vip"
    create: true
    slug: "vip-{{name}}"
    fields:
      - { label: "Nom de la personne", name: "title", widget: "string" }
      - { label: "Période (ex: Mai 2026)", name: "periode", widget: "string" }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Texte / Interview", name: "body", widget: "markdown" }
      - { label: "Tag", name: "tags", widget: "hidden", default: "vip" }

  - name: "agenda"
    label: "Agenda"
    folder: "agenda"
    create: true
    slug: "event-{{year}}-{{month}}-{{day}}"
    fields:
      - { label: "Titre de l'événement", name: "title", widget: "string" }
      - { label: "Date de l'événement", name: "date", widget: "datetime" }
      - { label: "Lieu", name: "location", widget: "string", default: "Au quartier" }
      - { label: "Image (affiche)", name: "image", widget: "image", required: false }
      - { label: "Description", name: "body", widget: "markdown" }
      - { label: "Tag", name: "tags", widget: "hidden", default: "event" }
  
  - name: "galerie"
    label: "Galerie"
    files:
      - file: "galerie.njk" # ⚠️ Vérifie si ton chemin commence bien par "src/" chez toi
        label: "Galerie"
        name: "galerie"
        fields:
              - { label: "Nom de l'album", name: "title", widget: "string" }
              - { label: "Identifiant unique (Minuscules, sans espace ni accent. Ex: grand-feu)", name: "slug", widget: "string" }
              - label: "Photos de l'album"
                name: "photos"
                widget: "list"
                summary: "{{fields.alt}}"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Légende / Description de la photo", name: "alt", widget: "string" }